<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hello from the Village of Somerset Glen. Our website is coming soon!">
    <title>Village of Somerset Glen</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Courier New", Courier, monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: #fff;
        background-color: #000020;
        background-image:
          radial-gradient(circle at 12% 18%, #fff 0 1px, transparent 2px),
          radial-gradient(circle at 72% 32%, #00ffff 0 1px, transparent 2px),
          radial-gradient(circle at 45% 78%, #ff40ff 0 1px, transparent 2px),
          radial-gradient(circle at 88% 86%, #fff 0 1px, transparent 2px);
        background-size: 97px 83px, 131px 109px, 149px 137px, 173px 151px;
      }

      main {
        width: min(92%, 760px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 3rem 1rem 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      h1 {
        margin: 0;
        color: #ffff00;
        font-size: clamp(2rem, 8vw, 4.75rem);
        line-height: 1.08;
        letter-spacing: 0.04em;
        text-shadow: 3px 3px 0 #ff00ff, 6px 6px 0 #0040ff;
      }

      .rainbow-rule {
        width: 100%;
        height: 8px;
        margin: 2rem 0 1.5rem;
        border: 0;
        background: linear-gradient(
          90deg,
          #ff0000 0 16.6%,
          #ffff00 16.6% 33.2%,
          #00ff00 33.2% 49.8%,
          #00ffff 49.8% 66.4%,
          #0040ff 66.4% 83%,
          #ff00ff 83% 100%
        );
      }

      .worker {
        width: min(78vw, 320px);
        height: auto;
        display: block;
        border: 4px ridge #c0c0c0;
        background: #000;
        image-rendering: pixelated;
      }

      .coming-soon {
        margin: 1.5rem 0 0;
        color: #ff4040;
        font-size: clamp(1.6rem, 7vw, 3.5rem);
        font-weight: 700;
        letter-spacing: 0.12em;
        text-shadow: 2px 2px 0 #ffff00;
        animation: blink 0.8s steps(2, start) infinite;
      }

      @keyframes blink {
        50% {
          visibility: hidden;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .coming-soon {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello from the Village of Somerset Glen</h1>
      <hr class="rainbow-rule">
      <img
        class="worker"
        src="assets/construction-worker.gif"
        alt="A pixel-art construction worker digging a hole"
        width="320"
        height="320"
      >
      <p class="coming-soon">COMING SOON!</p>
    </main>
  </body>
</html>
